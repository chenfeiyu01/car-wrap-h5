<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zan车搭 · 四款标志对比</title>
    <style>
      * { box-sizing: border-box; }
      html { color-scheme: light; background: #fff; }
      body { margin: 0; color: #191b20; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      main { max-width: 1600px; margin: 0 auto; padding: 46px 54px 30px; }
      header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 30px; }
      .eyebrow { margin: 0 0 12px; color: #a93640; font-size: 13px; font-weight: 650; letter-spacing: 2.4px; }
      h1 { margin: 0; font-size: 34px; font-weight: 650; letter-spacing: -.7px; }
      .edition { margin: 0 0 4px 24px; color: #74777e; font-size: 15px; white-space: nowrap; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
      article { min-width: 0; height: 408px; padding: 28px 32px 23px; border: 1px solid #e3e5e8; background: #fff; }
      .heading { display: flex; align-items: baseline; gap: 13px; }
      .letter { color: #dc2233; font-size: 26px; font-weight: 750; }
      h2 { margin: 0; font-size: 22px; font-weight: 600; }
      .art { height: 260px; display: flex; align-items: center; justify-content: center; }
      .art svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .art.badge svg { width: 82%; }
      .description { margin: 4px 0 0; color: #686d75; font-size: 15px; line-height: 1.7; }
      .description a { color: inherit; text-decoration: none; }
      .description a:hover { text-decoration: underline; }
      footer { display: flex; justify-content: space-between; gap: 18px; margin-top: 24px; color: #777c84; font-size: 13px; line-height: 1.7; }
      footer a { color: #555c67; text-underline-offset: 3px; }
      @media (max-width: 760px) {
        main { padding: 28px 18px; }
        header { display: block; }
        h1 { font-size: 27px; }
        .edition { margin: 14px 0 0; }
        .grid { grid-template-columns: 1fr; gap: 18px; }
        article { height: 320px; padding: 22px; }
        .art { height: 195px; }
        h2 { font-size: 20px; }
        .description { font-size: 13px; }
        footer { display: block; }
      }
    </style>
  </head>

</html>
